<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Pula Prédios Modern</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div id="game-container">
        <div id="start-screen" class="game-screen active">
            <h1>PULA PRÉDIOS</h1>
            <p>Pressione ESPAÇO ou toque na tela para pular!</p>
            <button class="game-button" id="start-button">COMEÇAR</button>
        </div>

        <div id="game-over-screen" class="game-screen">
            <h1>GAME OVER!</h1>
            <p id="final-score">Pontos: 0</p>
            <button class="game-button" id="restart-button">JOGAR NOVAMENTE</button>
        </div>
    </div>

    <script src="script.js"></script> </body>
</html>
