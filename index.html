<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pula Prédios</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="startScreen" class="overlay">
    <h1>PULA PRÉDIOS</h1>
    <p>Pressione <strong>ESPAÇO</strong> ou toque na tela para pular!</p>
    <button onclick="startGame()">COMEÇAR</button>
  </div>

  <div id="gameOverScreen" class="overlay" style="display: none;">
    <h2>Game Over</h2>
    <p>Sua pontuação: <span id="finalScore">0</span></p>
    <button onclick="restartGame()">JOGAR NOVAMENTE</button>
  </div>

  <div id="hud">
    <span>Pontuação: <span id="score">0</span></span>
    <button id="muteButton" onclick="toggleSound()">🔊</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <!-- Sons -->
  <audio id="jumpSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_661de257f2.mp3"></audio>
  <audio id="hitSound" src="https://cdn.pixabay.com/audio/2022/10/26/audio_4b45c4183c.mp3"></audio>
  <audio id="bgMusic" src="https://cdn.pixabay.com/audio/2023/03/30/audio_9f0e1dc4a3.mp3" loop></audio>

  <script src="script.js" defer></script>
</body>
</html>
